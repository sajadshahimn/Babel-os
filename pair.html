<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MULTI-VIEW // Babel-OS</title>
<meta name="description" content="Multiple galleries side by side, all sharing one address.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050806;
  --surface:#0a120d;
  --track:#0a120d;
  --fg:#7dff7d;
  --fg-bright:#d4ffd4;
  --muted:#2c5c2c;
  --accent:#7dff7d;
  --accent2:#4aff4a;
  --border:#1a3a1a;
  --border-bright:#4aff4a;
  --font:'Share Tech Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-transform:uppercase}
*{box-sizing:border-box}
a{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--fg)}
a:hover{background:var(--fg);color:var(--bg)}

body{
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  overflow:hidden;
  position:relative;
}

/* CRT Scanlines */
body::before{
  content:" ";display:block;position:fixed;top:0;left:0;bottom:0;right:0;
  background:
    linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.35) 50%),
    linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.02), rgba(0,0,255,0.04));
  z-index:100;background-size:100% 2px, 3px 100%;
  pointer-events:none;
}
::selection{background:var(--fg);color:var(--bg)}

/* Top Bar */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  flex-wrap:wrap;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;
  z-index:2;
}
.back{color:var(--muted);font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:.06em;border-bottom:none}
.back:hover{color:var(--fg);background:transparent}
.addr-row{display:flex;gap:5px;flex:1;min-width:200px}
.addr-row input{
  flex:1;min-width:0;
  padding:8px 12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--fg-bright);
  font:12px var(--font);
  letter-spacing:.3px;text-transform:uppercase;
}
.addr-row input:focus{outline:none;border-color:var(--fg)}
.btn{
  border:1px solid var(--border);
  background:transparent;
  color:var(--fg);
  padding:8px 12px;
  font:11.5px var(--font);
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;transition:all .1s;
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;flex-shrink:0;
}
.btn:hover{background:rgba(125,255,125,0.08);border-color:var(--fg-bright);box-shadow:0 0 8px rgba(125,255,125,0.3)}
.btn:active{background:var(--fg);color:var(--bg)}
.btn.primary{background:var(--fg);color:var(--bg);font-weight:700}
.btn.primary:hover{background:var(--fg-bright);border-color:var(--fg-bright)}
.btn.small{padding:5px 9px;font-size:10.5px}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}

/* Sector Selector */
.selector{
  display:flex;gap:4px;
  flex-wrap:nowrap;overflow-x:auto;
  padding:8px 14px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  scrollbar-width:thin;
  position:relative;z-index:2;
}
.sel-chip{
  padding:6px 12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:11px;font-weight:700;
  letter-spacing:.05em;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;flex-shrink:0;
  display:inline-flex;align-items:center;gap:5px;
  user-select:none;
}
.sel-chip:hover{border-color:var(--fg);color:var(--fg-bright)}
.sel-chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.sel-chip input{display:none}
.sel-chip::before{content:'[ ]';font-family:var(--font);opacity:.7}
.sel-chip.on::before{content:'[X]';opacity:1}

/* Panes Grid */
.panes{
  flex:1;
  display:grid;
  gap:2px;
  padding:2px;
  background:var(--border);
  min-height:0;
  overflow:hidden;
  position:relative;z-index:2;
}
.panes[data-count="1"]{grid-template-columns:1fr}
.panes[data-count="2"]{grid-template-columns:1fr 1fr}
.panes[data-count="3"]{grid-template-columns:1fr 1fr 1fr}
.panes[data-count="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panes[data-count="5"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.panes[data-count="5"] > :nth-child(1){grid-column:span 2}
.panes[data-count="6"]{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}

.pane{
  display:flex;flex-direction:column;
  min-height:0;overflow:hidden;
  background:var(--bg);
  position:relative;
}
.pane-bar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  min-height:32px;
  gap:6px;
}
.pane-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--fg);
  display:flex;align-items:center;gap:5px;
}
.pane-label .id{color:var(--muted);font-weight:400}
.pane-actions{display:flex;gap:3px;align-items:center}

.frame-wrap{
  flex:1;position:relative;
  min-height:120px;
  background:#000;
  overflow:hidden;
  border:1px solid var(--border);
  margin:2px;
}
.frame-wrap iframe{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  border:0;display:block;
  background:var(--bg);
}

/* Loading Overlay */
.loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;
  background:var(--bg);
  z-index:2;pointer-events:none;
  letter-spacing:.06em;
}
.loading::before{content:'[ LOADING... ]'}

/* Hintbar */
.hintbar{
  flex:0 0 auto;
  padding:6px 14px;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  font-size:10px;color:var(--muted);
  letter-spacing:.05em;
  position:relative;z-index:2;
}
.hintbar kbd{
  display:inline-block;padding:1px 5px;
  border:1px solid var(--border);
  background:var(--bg);
  font-family:var(--font);font-size:9.5px;
  color:var(--fg);
}
.hintbar span{display:inline-flex;align-items:center;gap:4px}

/* Mobile */
@media (max-width:820px){
  .topbar{padding:8px 10px;gap:5px}
  .addr-row{order:2;width:100%;flex-basis:100%}
  .btn{padding:7px 10px;font-size:10.5px}
  .selector{padding:6px 10px}
  .sel-chip{padding:5px 9px;font-size:10px}
  .panes[data-count="2"],.panes[data-count="3"],
  .panes[data-count="4"],.panes[data-count="5"],
  .panes[data-count="6"]{
    grid-template-columns:1fr;
    grid-template-rows:repeat(var(--rows,2),minmax(240px,1fr));
  }
  .panes[data-count="2"]{--rows:2}
  .panes[data-count="3"]{--rows:3}
  .panes[data-count="4"]{--rows:4}
  .panes[data-count="5"]{--rows:5}
  .panes[data-count="5"] > :nth-child(1){grid-column:auto}
  .panes[data-count="6"]{--rows:6}
  .hintbar{font-size:9px;gap:8px;padding:5px 8px}
  .hintbar span:nth-child(3){display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back">&lt; RETURN</a>
  <div class="addr-row">
    <input id="addr" type="text" placeholder="ADDRESS..." autocomplete="off" spellcheck="false" aria-label="Address">
    <button class="btn primary" id="go" type="button">&gt; BROADCAST</button>
    <button class="btn" id="prev" type="button" aria-label="Previous">‹</button>
    <button class="btn" id="next" type="button" aria-label="Next">›</button>
    <button class="btn" id="rand" type="button" aria-label="Random">🎲</button>
    <button class="btn" id="copy" type="button">COPY</button>
  </div>
</header>

<div class="selector" id="selector">
  <label class="sel-chip on" data-g="music"><input type="checkbox" checked>MUSIC</label>
  <label class="sel-chip on" data-g="image"><input type="checkbox" checked>VISUAL</label>
  <label class="sel-chip" data-g="code"><input type="checkbox">CODE</label>
  <label class="sel-chip" data-g="ecosystem"><input type="checkbox">BIO</label>
  <label class="sel-chip" data-g="aquarium"><input type="checkbox">OCEAN</label>
  <label class="sel-chip" data-g="galaxy"><input type="checkbox">SPACE</label>
</div>

<main class="panes" id="panes" data-count="2"></main>

<footer class="hintbar">
  <span><kbd>SPACE</kbd> AUDIO TOGGLE</span>
  <span><kbd>R</kbd> RANDOM</span>
  <span><kbd>←</kbd> <kbd>→</kbd> PREV/NEXT</span>
  <span><kbd>C</kbd> COPY_ADDR</span>
</footer>

<script>
(function(){
"use strict";

var GALLERIES = {
  music:     { name: 'MUSIC',   icon: '🎵', url: 'music.html',     sound: true,  id: 'AUDIO_ARRAY' },
  image:     { name: 'VISUAL',  icon: '🖼', url: 'image.html',                  id: 'VISUAL_MATRIX' },
  code:      { name: 'CODE',    icon: '💻', url: 'code.html',                   id: 'SCRIPTORIUM' },
  ecosystem: { name: 'BIO',     icon: '🌱', url: 'ecosystem.html',              id: 'BIO_SIM' },
  aquarium:  { name: 'OCEAN',   icon: '🐠', url: 'aquarium.html',               id: 'OCEANIC_PROBE' },
  galaxy:    { name: 'SPACE',   icon: '🌌', url: 'galaxy.html',                 id: 'DEEP_SPACE' }
};

var B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
var currentAddr = '';
var active = ['music', 'image'];
var playingMusic = false;

var $ = function(id){ return document.getElementById(id); };
var panes = $('panes');

function randomAddress(){
  var buf = new Uint8Array(24);
  try { (window.crypto || window.msCrypto).getRandomValues(buf); }
  catch(e) { for (var i=0; i<24; i++) buf[i] = Math.floor(Math.random()*256); }
  var s = '';
  for (var j=0; j<24; j++) s += B62[buf[j] % 62];
  return s;
}

function encodeAddr(){
  return 'a=' + encodeURIComponent(currentAddr);
}

function setIframeSrc(iframe, g, addr){
  var meta = GALLERIES[g];
  if (g === 'music'){
    iframe.src = meta.url + '#' + encodeAddr() + '&embed=1';
  } else {
    iframe.src = meta.url + '#' + encodeAddr();
  }
}

function buildPanes(){
  var panes_ = $('panes');
  panes_.innerHTML = '';
  panes_.setAttribute('data-count', active.length);

  active.forEach(function(g, idx){
    var meta = GALLERIES[g];
    var pane = document.createElement('div');
    pane.className = 'pane';
    pane.dataset.g = g;

    // ---- Header Bar ----
    var bar = document.createElement('div');
    bar.className = 'pane-bar';

    var lbl = document.createElement('span');
    lbl.className = 'pane-label';
    lbl.innerHTML = meta.icon + ' ' + meta.name + ' <span class="id">// ' + meta.id + '</span>';
    bar.appendChild(lbl);

    var actions = document.createElement('div');
    actions.className = 'pane-actions';

    if (meta.sound){
      var playBtn = document.createElement('button');
      playBtn.className = 'btn small';
      playBtn.id = 'play-' + g;
      playBtn.type = 'button';
      playBtn.textContent = playingMusic ? '■ STOP' : '▶ PLAY';
      playBtn.addEventListener('click', function(){ toggleSound(g); });
      actions.appendChild(playBtn);
    }

    var openBtn = document.createElement('a');
    openBtn.className = 'btn small ghost';
    openBtn.textContent = '↗ FULL';
    openBtn.href = meta.url + '#' + encodeAddr();
    openBtn.target = '_blank';
    openBtn.rel = 'noopener';
    actions.appendChild(openBtn);

    bar.appendChild(actions);
    pane.appendChild(bar);

    // ---- Frame ----
    var wrap = document.createElement('div');
    wrap.className = 'frame-wrap';

    var loading = document.createElement('div');
    loading.className = 'loading';

    var iframe = document.createElement('iframe');
    iframe.title = meta.name;
    if (meta.sound) iframe.setAttribute('allow', 'autoplay');
    iframe.dataset.g = g;
    iframe.addEventListener('load', function(){
      loading.style.display = 'none';
    });

    wrap.appendChild(iframe);
    wrap.appendChild(loading);
    pane.appendChild(wrap);
    panes_.appendChild(pane);

    if (currentAddr){
      setIframeSrc(iframe, g, currentAddr);
      setTimeout(function(){ loading.style.display = 'none'; }, 5000);
    }
  });
}

function broadcastAddress(addr){
  currentAddr = addr;
  $('addr').value = addr;
  try { history.replaceState(null, '', '#' + encodeAddr()); } catch(e){}

  panes.querySelectorAll('iframe').forEach(function(iframe){
    setIframeSrc(iframe, iframe.dataset.g, addr);
  });

  panes.querySelectorAll('.pane-actions a').forEach(function(a){
    var g = a.closest('.pane').dataset.g;
    a.href = GALLERIES[g].url + '#' + encodeAddr();
  });

  playingMusic = false;
  var playBtn = $('play-music');
  if (playBtn) playBtn.textContent = '▶ PLAY';
}

function toggleSound(g){
  var iframe = panes.querySelector('iframe[data-g="' + g + '"]');
  if (!iframe) return;
  var btn = $('play-' + g);
  if (!btn) return;
  try {
    if (playingMusic){
      iframe.contentWindow.postMessage({action:'stop'}, '*');
      playingMusic = false;
      btn.textContent = '▶ PLAY';
    } else {
      iframe.contentWindow.postMessage({action:'play'}, '*');
      playingMusic = true;
      btn.textContent = '■ STOP';
    }
  } catch(e){}
}

function toggleGallery(g){
  var idx = active.indexOf(g);
  if (idx >= 0){
    if (active.length <= 1) return;
    active.splice(idx, 1);
  } else {
    active.push(g);
  }
  buildPanes();
  if (currentAddr) broadcastAddress(currentAddr);
}

$('selector').addEventListener('click', function(e){
  var chip = e.target.closest('.sel-chip');
  if (!chip) return;
  e.preventDefault();
  var g = chip.dataset.g;
  toggleGallery(g);
  chip.classList.toggle('on', active.indexOf(g) >= 0);
});

$('go').addEventListener('click', function(){
  var a = $('addr').value.trim().replace(/[^0-9A-Za-z]/g, '');
  if (a) broadcastAddress(a);
});
$('addr').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); $('go').click(); }
});

function toB62(n){
  if (n === 0n) return '0';
  var s = '';
  while (n > 0n){ s = B62[Number(n % 62n)] + s; n /= 62n; }
  return s;
}
function fromB62(s){
  var n = 0n;
  for (var i = 0; i < s.length; i++){
    var k = B62.indexOf(s[i]);
    if (k < 0) return null;
    n = n * 62n + BigInt(k);
  }
  return n;
}

$('prev').addEventListener('click', function(){
  if (!currentAddr) return;
  var n = fromB62(currentAddr);
  if (n === null) return;
  n = n - 1n;
  if (n < 0n) n = 0n;
  broadcastAddress(n === 0n ? '0' : toB62(n));
});
$('next').addEventListener('click', function(){
  if (!currentAddr) return;
  var n = fromB62(currentAddr);
  if (n === null) return;
  n += 1n;
  broadcastAddress(toB62(n));
});
$('rand').addEventListener('click', function(){
  broadcastAddress(randomAddress());
});
$('copy').addEventListener('click', function(){
  if (!currentAddr) return;
  var b = this;
  navigator.clipboard.writeText(currentAddr).then(function(){
    var t = b.textContent;
    b.textContent = 'COPIED ✓';
    setTimeout(function(){ b.textContent = t; }, 1200);
  });
});

document.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.code === 'Space' || e.key === ' '){
    if (active.indexOf('music') >= 0){ e.preventDefault(); toggleSound('music'); }
  } else if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); $('rand').click(); }
  else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); $('copy').click(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); $('prev').click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); $('next').click(); }
});

function currentAddrFromHash(){
  try {
    return new URLSearchParams(location.hash.slice(1)).get('a') || '';
  } catch(e){ return ''; }
}

window.addEventListener('hashchange', function(){
  var a = currentAddrFromHash();
  if (a && a !== currentAddr) broadcastAddress(a);
});

// Init
buildPanes();
var initial = currentAddrFromHash();
if (!initial) initial = randomAddress();
setTimeout(function(){ broadcastAddress(initial); }, 100);

})();
</script>
</body>
</html>
